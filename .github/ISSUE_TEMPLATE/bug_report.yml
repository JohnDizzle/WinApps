name: Bug report
description: Report a reproducible WinApps problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove personal data from logs and screenshots."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or diagnostics
